{% extends "layout.html" %}

{% block content %}
<div class="flex items-center justify-center min-h-[65vh] fade-in px-4 py-8">
    <div class="w-full max-w-md p-8 bg-[var(--card-bg)] border border-[var(--border)] rounded-3xl shadow-2xl backdrop-blur-md">
        <h2 class="text-3xl font-extrabold text-[var(--text-primary)] mb-2 tracking-tight">Welcome Back</h2>
        <p class="text-sm text-[var(--text-secondary)] mb-8">{{ type }} Portal &mdash; Secure Sign In</p>
        
        <form id="login-form">
            <div id="error-msg" class="hidden mb-4 p-3 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 text-xs font-bold text-center"></div>

            <div class="mb-5">
                <label class="block text-xs font-bold text-[var(--text-secondary)] uppercase tracking-wider mb-2">Email Address</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-[var(--text-secondary)]"><i class="fas fa-envelope text-sm"></i></span>
                    <input type="email" id="email" class="w-full pl-12 pr-4 py-3 rounded-xl bg-[var(--body-bg)] border border-[var(--border)] text-[var(--text-primary)] focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/10 transition-all outline-none text-sm placeholder-[var(--text-secondary)]" placeholder="Firebase Registered Email" required>
                </div>
            </div>
            <div class="mb-8">
                <label class="block text-xs font-bold text-[var(--text-secondary)] uppercase tracking-wider mb-2">Password</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-[var(--text-secondary)]"><i class="fas fa-lock text-sm"></i></span>
                    <input type="password" id="password" class="w-full pl-12 pr-4 py-3 rounded-xl bg-[var(--body-bg)] border border-[var(--border)] text-[var(--text-primary)] focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/10 transition-all outline-none text-sm placeholder-[var(--text-secondary)]" placeholder="••••••••" required>
                </div>
            </div>
            
            <button type="submit" id="submit-btn" class="w-full py-3.5 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-650 hover:to-purple-750 text-white font-bold rounded-xl shadow-lg shadow-indigo-500/20 hover:shadow-indigo-500/40 hover:scale-[1.01] transition-all duration-300 text-sm">
                Sign In securely via Firebase
            </button>
        </form>
        
        <p class="mt-8 text-center text-xs text-[var(--text-secondary)]">
            Don't have an account? 
            <a href="{{ url_for('admin_setup') if type == 'Admin' else url_for('student_register') }}" class="text-indigo-400 hover:text-indigo-300 font-bold ml-1">Create one</a>
        </p>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "{{ config.get('FIREBASE_API_KEY', 'YOUR_API_KEY') }}",
        authDomain: "{{ config.get('FIREBASE_AUTH_DOMAIN', 'YOUR_AUTH_DOMAIN') }}",
        projectId: "{{ config.get('FIREBASE_PROJECT_ID', 'YOUR_PROJECT_ID') }}",
        storageBucket: "{{ config.get('FIREBASE_STORAGE_BUCKET', '') }}",
        messagingSenderId: "{{ config.get('FIREBASE_MESSAGING_SENDER_ID', '') }}",
        appId: "{{ config.get('FIREBASE_APP_ID', '') }}"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const role = "{{ type }}";
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('error-msg');
        const btn = document.getElementById('submit-btn');
        
        if (!firebaseConfig.apiKey || firebaseConfig.apiKey === 'YOUR_API_KEY') {
            errorDiv.innerText = "Firebase Error: API Key is missing. Add FIREBASE_API_KEY to your .env file.";
            errorDiv.classList.remove('hidden');
            return;
        }

        try {
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            btn.disabled = true;
            errorDiv.classList.add('hidden');

            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;
            const idToken = await user.getIdToken(true); // force refresh

            // Send token to backend to create session
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idToken, role: role.toLowerCase() })
            });

            const data = await res.json();
            if(!res.ok) {
                auth.signOut();
                throw new Error(data.error || 'Server rejected login');
            }

            window.location.href = data.redirect;
        } catch (error) {
            errorDiv.innerText = error.code ? error.code.replace('auth/', '') : error.message;
            errorDiv.classList.remove('hidden');
            btn.innerHTML = 'Sign In securely via Firebase';
            btn.disabled = false;
        }
    });
</script>
{% endblock %}
