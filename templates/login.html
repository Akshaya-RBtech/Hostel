{% extends "layout.html" %}

{% block content %}
<div style="display:flex;align-items:center;justify-content:center;min-height:65vh;padding:24px 16px;">
    <div style="width:100%;max-width:420px;">
        <div class="card" style="padding:0;overflow:hidden;">
            <!-- Header Accent -->
            <div style="background:linear-gradient(135deg, var(--primary), var(--primary-dark));padding:28px 32px;">
                <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;">
                    <div style="width:42px;height:42px;background:rgba(255,255,255,0.15);border-radius:12px;display:flex;align-items:center;justify-content:center;">
                        {% if type == 'Admin' %}
                        <i class="fas fa-user-shield" style="color:white;font-size:18px;"></i>
                        {% else %}
                        <i class="fas fa-graduation-cap" style="color:white;font-size:18px;"></i>
                        {% endif %}
                    </div>
                    <div>
                        <h2 style="font-size:22px;font-weight:800;color:white;letter-spacing:-0.5px;">Welcome Back</h2>
                        <p style="font-size:12px;color:rgba(255,255,255,0.7);font-weight:500;">{{ type }} Portal &mdash; Sign in to continue</p>
                    </div>
                </div>
            </div>

            <div style="padding:28px 32px;">
                <!-- Error display -->
                <div id="login-error" style="display:none;padding:12px 14px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:10px;color:var(--danger);font-size:13px;font-weight:500;margin-bottom:16px;">
                    <i class="fas fa-circle-exclamation" style="margin-right:6px;"></i>
                    <span id="login-error-text"></span>
                </div>

                <!-- Success display -->
                <div id="login-success" style="display:none;padding:12px 14px;background:rgba(16,185,129,0.08);border:1px solid rgba(16,185,129,0.2);border-radius:10px;color:var(--success);font-size:13px;font-weight:500;margin-bottom:16px;">
                    <i class="fas fa-check-circle" style="margin-right:6px;"></i>
                    <span id="login-success-text"></span>
                </div>

                <form id="login-form" onsubmit="event.preventDefault(); handleLogin();">
                    <div class="form-group">
                        <label class="form-label" for="email">Email Address</label>
                        <div style="position:relative;">
                            <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);"><i class="fas fa-envelope" style="font-size:13px;"></i></span>
                            <input type="email" name="email" id="email" class="form-input" style="padding-left:40px;" placeholder="you@example.com" required>
                        </div>
                    </div>

                    <div class="form-group" style="margin-bottom:24px;">
                        <label class="form-label" for="password">Password</label>
                        <div style="position:relative;">
                            <span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-muted);"><i class="fas fa-lock" style="font-size:13px;"></i></span>
                            <input type="password" name="password" id="password" class="form-input" style="padding-left:40px;" placeholder="••••••••" required>
                        </div>
                    </div>

                    <button type="submit" id="login-btn" class="btn-primary" style="width:100%;justify-content:center;padding:13px;font-size:14px;">
                        <i class="fas fa-arrow-right-to-bracket"></i>
                        <span>Sign In</span>
                    </button>
                </form>

                <div style="margin-top:20px;text-align:center;">
                    {% if type == 'Admin' %}
                    <p style="font-size:12px;color:var(--text-muted);">
                        Need an admin account? <a href="{{ url_for('admin_setup') }}" style="color:var(--primary);text-decoration:none;font-weight:600;">Register here</a>
                    </p>
                    {% else %}
                    <p style="font-size:12px;color:var(--text-muted);">
                        Don't have an account? <a href="{{ url_for('student_register') }}" style="color:var(--primary);text-decoration:none;font-weight:600;">Register here</a>
                    </p>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script>
    const LOGIN_ROLE = "{{ type | lower }}";

    // Fetch Firebase config from backend (never hardcode in frontend)
    let firebaseReady = false;

    async function initFirebaseAuth() {
        try {
            const res = await fetch('/api/firebase-config');
            if (!res.ok) {
                console.warn('Backend returned non-200 for config endpoint');
            }
            const contentType = res.headers.get("content-type");
            if (!contentType || !contentType.includes("application/json")) {
                throw new Error("Server returned an invalid HTML/Non-JSON response for configuration.");
            }
            const config = await res.json();
            if (!config.apiKey) {
                showLoginError('Firebase is not configured. Contact the administrator.');
                return;
            }
            if (!firebase.apps.length) {
                firebase.initializeApp(config);
            }
            firebaseReady = true;
        } catch (e) {
            console.error('Could not load Firebase config:', e);
            showLoginError('Could not connect to the server. Please try again later.');
        }
    }

    initFirebaseAuth();

    function showLoginError(msg) {
        const el = document.getElementById('login-error');
        document.getElementById('login-error-text').textContent = msg;
        el.style.display = 'block';
        document.getElementById('login-success').style.display = 'none';
    }

    function showLoginSuccess(msg) {
        const el = document.getElementById('login-success');
        document.getElementById('login-success-text').textContent = msg;
        el.style.display = 'block';
        document.getElementById('login-error').style.display = 'none';
    }

    async function handleLogin() {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const btn = document.getElementById('login-btn');

        if (!email || !password) {
            showLoginError('Please enter your email and password.');
            return;
        }

        if (!firebaseReady) {
            showLoginError('Firebase is not ready. Please refresh and try again.');
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
        document.getElementById('login-error').style.display = 'none';

        try {
            const userCredential = await firebase.auth().signInWithEmailAndPassword(email, password);
            const idToken = await userCredential.user.getIdToken();

            // Send token to Flask backend for verification
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ idToken: idToken, role: LOGIN_ROLE })
            });

            const contentType = res.headers.get("content-type");
            if (!contentType || !contentType.includes("application/json")) {
                // If it isn't JSON, throw an error, preventing JSON parse crash
                throw new Error("Server returned HTML instead of JSON. The backend authentication route may have crashed.");
            }

            const data = await res.json();

            if (data.success) {
                showLoginSuccess('Login successful! Redirecting...');
                window.location.href = data.redirect;
            } else {
                showLoginError(data.error || 'Login failed. Please check your credentials.');
            }
        } catch (error) {
            console.error('Login error:', error);
            const errorMessages = {
                'auth/user-not-found': 'No account found with this email.',
                'auth/wrong-password': 'Incorrect password. Please try again.',
                'auth/invalid-email': 'Invalid email address.',
                'auth/invalid-credential': 'Invalid email or password.',
                'auth/too-many-requests': 'Too many attempts. Please try again later.',
                'auth/user-disabled': 'This account has been disabled.',
                'auth/network-request-failed': 'Network error. Check your connection.'
            };
            showLoginError(errorMessages[error.code] || error.message || 'An error occurred during login.');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i><span>Sign In</span>';
        }
    }
</script>
{% endblock %}
