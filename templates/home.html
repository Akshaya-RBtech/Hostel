{% extends "layout.html" %}

{% block content %}
<style>
    /* Prevent default header from showing on landing page to allow custom nav */
    .top-header { display: none !important; }
    .main-content { padding: 0 !important; margin: 0 !important; }
    
    .landing-bg {
        position: relative;
        min-height: 100vh;
        width: 100vw;
        background: linear-gradient(to bottom, rgba(240,249,255,1) 0%, rgba(224,242,254,0.5) 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
    }
    .landing-nav {
        width: 100%;
        max-width: 1000px;
        padding: 24px 32px;
        display: flex;
        justify-content: flex-end;
        gap: 32px;
        z-index: 10;
    }
    .landing-nav a {
        color: #1e3a8a;
        font-weight: 600;
        font-size: 14px;
        text-decoration: none;
        transition: color 0.2s;
    }
    .landing-nav a:hover { color: var(--primary); }
    
    .landing-hero {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 20px;
        z-index: 10;
        margin-top: -60px;
    }
    .landing-food-bg {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 45vh;
        background: url('https://images.unsplash.com/photo-1546069901-ba9599a7e63c?q=80&w=2680&auto=format&fit=crop') no-repeat center bottom;
        background-size: cover;
        opacity: 0.15;
        mask-image: linear-gradient(to top, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 100%);
        -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 30%, rgba(0,0,0,0) 100%);
        z-index: 1;
    }
</style>

<div class="landing-bg">
    <!-- Top Nav -->
    <div class="landing-nav">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Features</a>
        <a href="#">Contact</a>
    </div>

    <!-- Center Content -->
    <div class="landing-hero" style="position:relative; z-index:10; background:rgba(255,255,255,0.85); padding:60px 40px; border-radius:24px; box-shadow:0 10px 40px rgba(0,0,0,0.05); text-align:center; backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.4); max-width:800px; width:100%; margin:80px 20px;">
        
        <div style="display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:24px;">
            <i class="fas fa-leaf" style="font-size:42px;color:var(--primary);"></i>
            <h1 style="font-size:42px;font-weight:900;color:#0f172a;letter-spacing:-1px;margin:0;">WasteZero</h1>
        </div>

        <h2 style="font-size:26px;font-weight:700;color:#1e293b;margin-bottom:12px;line-height:1.3;">
            Smart Mess Management<br>for a Greener Tomorrow
        </h2>

        <p style="font-size:15px;color:#64748b;margin-bottom:44px;font-weight:500;">
            Less Food Waste &nbsp;&bull;&nbsp; Better Nutrition &nbsp;&bull;&nbsp; A Healthier Campus
        </p>

        <div style="display:flex;gap:20px;justify-content:center;flex-wrap:wrap;">
            <a href="{{ url_for('student_login') }}" class="btn-primary" style="padding:14px 40px;font-size:15px;text-decoration:none;border-radius:12px;box-shadow:0 4px 14px rgba(16,185,129,0.3);">
                Student Login
            </a>
            <a href="{{ url_for('login') }}" style="padding:14px 40px;font-size:15px;text-decoration:none;border-radius:12px;border:2px solid var(--primary);color:var(--primary);font-weight:700;background:white;transition:all 0.2s;">
                Admin Login
            </a>
        </div>
    </div>
    
    <!-- Background Image -->
    <div class="landing-food-bg"></div>
</div>
{% endblock %}
