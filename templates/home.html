{% extends "layout.html" %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[70vh] text-center fade-in py-8 px-4">
    <div class="mb-6 p-4 bg-indigo-500/10 border border-indigo-500/20 rounded-2xl inline-block shadow-lg shadow-indigo-500/10">
        <i class="fas fa-leaf text-3xl text-indigo-400"></i>
    </div>

    <h1 class="text-3xl font-extrabold text-white mb-2 leading-tight tracking-tight">
        WasteZero
    </h1>
    
    <p class="text-sm text-slate-400 mb-8 max-w-sm">
        Smart Canteen. Less Waste.<br>A Greener Future.
    </p>

    <div class="w-full max-w-xs flex flex-col gap-4">
        <a href="{{ url_for('login') }}" class="btn-primary w-full justify-center py-3 text-sm">
            <i class="fas fa-user-shield"></i> Admin Login
        </a>

        <a href="{{ url_for('student_login') }}" class="btn-secondary w-full justify-center py-3 text-sm" style="background:rgba(255,255,255,0.05);">
            <i class="fas fa-graduation-cap"></i> Student Login
        </a>
    </div>
</div>
{% endblock %}
