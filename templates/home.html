{% extends "layout.html" %}

{% block content %}
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;text-align:center;padding:32px 16px;">

    <div style="margin-bottom:24px;padding:18px;background:rgba(99,102,241,0.08);border:1px solid rgba(99,102,241,0.15);border-radius:20px;display:inline-block;box-shadow:0 8px 30px rgba(99,102,241,0.1);">
        <i class="fas fa-leaf" style="font-size:32px;color:var(--primary);"></i>
    </div>

    <h1 style="font-size:36px;font-weight:900;color:var(--text-primary);margin-bottom:8px;letter-spacing:-1px;line-height:1.1;">
        WasteZero
    </h1>

    <p style="font-size:15px;color:var(--text-secondary);margin-bottom:32px;max-width:340px;line-height:1.6;">
        Smart Canteen. Less Waste.<br>A Greener Future.
    </p>

    <div style="width:100%;max-width:280px;display:flex;flex-direction:column;gap:12px;">
        <a href="{{ url_for('login') }}" class="btn-primary" style="width:100%;justify-content:center;padding:14px;font-size:14px;text-decoration:none;">
            <i class="fas fa-user-shield"></i> Admin Login
        </a>

        <a href="{{ url_for('student_login') }}" class="btn-secondary" style="width:100%;justify-content:center;padding:14px;font-size:14px;text-decoration:none;">
            <i class="fas fa-graduation-cap"></i> Student Login
        </a>
    </div>

    <div style="margin-top:40px;display:flex;align-items:center;gap:8px;color:var(--text-muted);font-size:11px;font-weight:600;">
        <div style="width:6px;height:6px;background:var(--success);border-radius:50%;animation:pulse-dot 2s infinite;"></div>
        AI-Powered Food Waste Management
    </div>
</div>
{% endblock %}
